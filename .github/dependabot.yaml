version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /src
      - /e2e
    target-branch: dev
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    groups:
      gomod:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
